<!DOCTYPE html>
<html>
<head>
  <title>Fatigue Assessment</title>

  <!-- 🔥 REQUIRED FOR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="logo.png" class="header-logo">
  <span>LINN COUNTY AMBULANCE DISTRICT</span>
</div>

<!-- LANDING PAGE -->
<div id="landing" class="hero">

  <div class="left">
    <h1>Fatigue Assessment</h1>
    <p>
      Your alertness impacts your team,<br>
      your patients, and your community.<br><br>
      Thank you for your commitment to safety.
    </p>

    <button onclick="startAssessment()">Begin Assessment →</button>
  </div>

  <div class="right">
    <img src="logo.png" class="main-logo">
  </div>

</div>

<!-- ASSESSMENT -->
<div id="assessment" class="centered">
  <h2 id="questionText"></h2>

  <input id="numericInput" type="number" />
  <select id="selectInput">
    <option value="">Select</option>
  </select>
  
<input id="textInput" type="text" placeholder="Enter response..." />

<!-- MULTISELECT CHECKBOX CONTAINER -->
<div
  id="multiSelectInput"
  style="
    display: none;
    flex-direction: column;
    gap: 10px;
    width: min(100%, 500px);
    margin-top: 12px;
  "
></div>

<button onclick="nextQuestion()">Next</button>

</div>

<!-- RESULT -->
<div id="result" class="centered">
  <h1 id="resultColor"></h1>
  <button onclick="restartAssessment()">Start Over</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
